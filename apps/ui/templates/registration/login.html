{% load static %}
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · MRP</title><link rel="stylesheet" href="{% static 'ui/app.css' %}"></head>
<body class="login-body"><main class="login-card"><div class="brand login-brand"><span class="brand-mark">M</span><span>MRP Control</span></div><h1>Entrar</h1><p class="muted">Interface operacional de planejamento e manufatura.</p>
{% if form.errors %}<div class="flash error">Usuário ou senha inválidos.</div>{% endif %}
<form method="post" class="login-form">{% csrf_token %}<label>Usuário{{ form.username }}</label><label>Senha{{ form.password }}</label><input type="hidden" name="next" value="{{ next }}"><button class="primary" type="submit">Entrar</button></form></main></body></html>
